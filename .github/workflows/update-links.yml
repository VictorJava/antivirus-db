name: Update link database

# Rebuilds links/ (dangerous sites and links for the app's Link protection) from URLhaus (malware-filter mirror)
# and Phishing.Database every day and commits it when it changed. Same as tools/update_link_db.sh in the app repo.
on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build link database
        run: python3 tools/build_link_db.py links

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add links
          # The manifest always carries a new timestamp; publish only when the lists themselves changed.
          if git diff --cached --quiet -- links/link-domains.bin links/link-urls.bin; then
            echo "Lists unchanged"; exit 0
          fi
          v=$(python3 -c "import json;print(json.load(open('links/links-manifest.json'))['version'])")
          git commit -m "Link database $v"
          git push
